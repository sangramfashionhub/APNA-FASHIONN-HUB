<!DOCTYPE html>
<html>
<head>
    <title>APLA FASHION HUB</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            background: black;
            color: white;
            padding: 15px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            width: 200px;
        }

        .card img {
            width: 100%;
            height: 150px;
            border-radius: 10px;
        }

        .chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: green;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>APLA FASHION HUB</h1>

    <div class="container">

        <div class="card">
            <img src="clothes.jpg">
            <h3>Clothes</h3>
        </div>

        <div class="card">
            <img src="footwear.jpg">
            <h3>Footwear</h3>
        </div>

        <div class="card">
            <img src="sunglasses.jpg">
            <h3>Sunglasses</h3>
        </div>

        <div class="card">
            <img src="home.jpg">
            <h3>Home Products</h3>
        </div>

    </div>

    <div class="chat" onclick="openChat()">💬</div>

    <script>
        function openChat() {
            window.open("https://wa.me/91XXXXXXXXXX", "_blank");
        }
    </script>

</body>
</html>
