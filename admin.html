<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Orders</title>

    <style>
        body { font-family: Arial; text-align: center; }

        h1 {
            background: black;
            color: white;
            padding: 10px;
            padding: 10px;
        }

        .card {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }

        button {
            margin: 5px;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .accept { background: orange; }
        .ship { background: blue; }
        .deliver { background: green; }
    </style>
</head>

<body>

<h1>🛠️ Admin Panel - Orders</h1>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 📦 LOAD ORDERS
async function loadOrders(){

    let snap = await get(ref(db, "orders"));

    let container = document.getElementById("orders");
    container.innerHTML = "";

    if(snap.exists()){

        let data = snap.val();

        Object.keys(data).forEach(id => {

            let order = data[id];

            container.innerHTML += `
                <div class="card">
                    <h3>Order ID: ${id}</h3>
                    <p>Product: ${order.name}</p>
                    <p>Qty: ${order.qty}</p>
                    <p>Status: <b>${order.status}</b></p>

                    <button class="accept" onclick="updateStatus('${id}','Accepted')">Accept</button>
                    <button class="ship" onclick="updateStatus('${id}','Shipped')">Ship</button>
                    <button class="deliver" onclick="updateStatus('${id}','Delivered')">Deliver</button>
                </div>
            `;
        });

    } else {
        container.innerHTML = "No orders found ❌";
    }
}

// 🔄 UPDATE STATUS
window.updateStatus = async function(id, status){

    await update(ref(db, "orders/" + id), {
        status: status
    });

    alert("Status updated to " + status);

    loadOrders();
}

// load on start
loadOrders();

</script>

</body>
</html>
