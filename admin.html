<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            background: black;
            color: white;
            padding: 12px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 150px;
            box-shadow: 0 0 10px #ccc;
        }

        .card {
            background: white;
            margin: 10px auto;
            padding: 10px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        button {
            margin: 5px;
            padding: 8px 10px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .a { background: orange; }
        .s { background: blue; }
        .d { background: green; }
    </style>
</head>

<body>

<h1>🛠️ ADMIN DASHBOARD</h1>

<!-- 📊 STATS -->
<div class="stats">
    <div class="box">
        <h3 id="totalOrders">0</h3>
        <p>Orders</p>
    </div>

    <div class="box">
        <h3 id="totalRevenue">0</h3>
        <p>Revenue</p>
    </div>
</div>

<!-- 📦 ORDERS -->
<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 📦 LIVE ORDERS
function loadOrders(){

    const ordersRef = ref(db, "orders");

    onValue(ordersRef, (snapshot) => {

        let container = document.getElementById("orders");
        container.innerHTML = "";

        let totalOrders = 0;
        let revenue = 0;

        if(snapshot.exists()){

            let data = snapshot.val();

            Object.keys(data).forEach(id => {

                let o = data[id];

                totalOrders++;
                revenue += Number(o.total || 0);

                container.innerHTML += `
                    <div class="card">
                        <h3>Order ID: ${id}</h3>
                        <p>Product: ${o.name}</p>
                        <p>Qty: ${o.qty}</p>
                        <p>Amount: ₹${o.total}</p>
                        <p>Status: <b>${o.status}</b></p>

                        <button class="a" onclick="updateStatus('${id}','Accepted')">Accept</button>
                        <button class="s" onclick="updateStatus('${id}','Shipped')">Ship</button>
                        <button class="d" onclick="updateStatus('${id}','Delivered')">Deliver</button>
                    </div>
                `;
            });
        }

        document.getElementById("totalOrders").innerText = totalOrders;
        document.getElementById("totalRevenue").innerText = revenue;

    });
}

// 🔄 UPDATE STATUS
window.updateStatus = async function(id, status){

    await update(ref(db, "orders/" + id), {
        status: status
    });

    alert("Status: " + status);
}

loadOrders();

</script>

</body>
</html>
