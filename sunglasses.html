<!DOCTYPE html>
<html>
<head>
    <title>Sunglasses</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        /* Container center karne */
        .container {
            display: flex;
            justify-content: center;   /* center horizontally */
            flex-wrap: wrap;           /* next line la jato */
            gap: 20px;
            padding: 20px;
        }

        /* Card design */
        .card {
            width: 200px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* Image size fix */
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;   /* image stretch honar nahi */
        }

        .card h3 {
            margin: 10px 0;
        }

        .card a {
            text-decoration: none;
            color: black;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <a href="aviator.html">
            <img src="photos/aviator.jpg">
            <h3>Aviator</h3>
        </a>
    </div>

    <div class="card">
        <a href="round.html">
            <img src="photos/round.jpg">
            <h3>Round</h3>
        </a>
    </div>

    <div class="card">
        <a href="sport.html">
            <img src="photos/sport.jpg">
            <h3>Sport</h3>
        </a>
    </div>

    <div class="card">
        <a href="stylish.html">
            <img src="photos/stylish.jpg">
            <h3>Stylish</h3>
        </a>
    </div>

</div>

</body>
</html>
