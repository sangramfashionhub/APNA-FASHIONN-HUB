<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Customer Details</h2>

<input type="text" id="name" placeholder="Name"><br><br>
<input type="text" id="mobile" placeholder="Mobile Number"><br><br>
<input type="text" id="address" placeholder="Address"><br><br>
<input type="text" id="pincode" placeholder="Pincode"><br><br>

<button onclick="saveData()">Save & Continue</button>

<script>
function saveData(){
    let user = {
        name: document.getElementById("name").value,
        mobile: document.getElementById("mobile").value,
        address: document.getElementById("address").value,
        pincode: document.getElementById("pincode").value
    };

    localStorage.setItem("user", JSON.stringify(user));

    alert("Details Saved ✅");

    window.location.href = "index.html";
}
</script>

</body>
</html>
