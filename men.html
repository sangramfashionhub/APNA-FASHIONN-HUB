<!DOCTYPE html>
<html>
<head>
    <title>Men Collection</title>

    <style>
        body { font-family: Arial; text-align: center; }

        h1 {
            background: black;
            color: white;
            padding: 10px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .product-card {
            width: 220px;
            margin: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 10px;
        }

        img {
            width: 100%;
            height: 200px;
        }

        .price { color: green; font-weight: bold; }

        select, input { margin: 5px; padding: 5px; }

        button {
            background: black;
            color: white;
            padding: 8px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        button:hover { background: green; }
    </style>
</head>

<body>

<!-- 🔐 LOGIN CHECK -->
<script>
let user = JSON.parse(localStorage.getItem("user"));
if(!user){
    window.location.href = "login.html";
}
</script>

<h1>👕 Men Collection</h1>

<!-- 🛒 CART BUTTON -->
<div style="text-align:right; margin:10px;">
    <a href="cart.html">
        <button>🛒 Cart</button>
    </a>
</div>

<!-- 📲 WhatsApp Button -->
<div style="margin:10px;">
    <button onclick="sendWhatsApp()">📲 Send WhatsApp Order</button>
</div>

<div class="container" id="productList"></div>

<script>

// 🟢 PRODUCTS
let products = [
    { name: "White Shirt", price: 499, size: ["S","L","XL"], image: "men.white.shirt.jpeg" },
    { name: "Black Jeans", price: 999, size: ["30","32","34"], image: "men.black.jean.jpeg" },
    { name: "Red T-Shirt", price: 299, size: ["S","L","XL"], image: "men.tshirt.red.jpeg" }
];

// 🛒 ADD TO CART
function addToCart(name, price, image, size, qty){

    qty = parseInt(qty);

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({ name, price, image, size, qty });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Added to cart ✅");
}

// 💳 BUY NOW (ONLY UPI)
function buyNow(name, price, size, qty){

    qty = parseInt(qty);
    let total = price * qty;

    let user = JSON.parse(localStorage.getItem("user"));

    let orderId = Math.floor(Math.random() * 100000);

    let msg = `🛍️ Order
ID: ${orderId}
Product: ${name}
Size: ${size}
Qty: ${qty}
Amount: ₹${total}
Name: ${user.name}
Mobile: ${user.mobile}
Address: ${user.address}
Pincode: ${user.pincode}`;

    let whatsapp = "https://wa.me/919923343791?text=" + encodeURIComponent(msg);

    // save WhatsApp link
    localStorage.setItem("whatsappLink", whatsapp);

    // UPI open
    let upi = "upi://pay?pa=9923343791@upi&pn=FashionHub&am=" + total + "&cu=INR";
    window.location.href = upi;

    alert("Payment झाल्यावर WhatsApp button वापरा 📲");
}

// 📲 WhatsApp SEND (WORKING 100%)
function sendWhatsApp(){

    let link = localStorage.getItem("whatsappLink");

    if(!link){
        alert("First Buy Now किंवा Cart वापरा");
        return;
    }

    window.open(link, "_blank");
}

// 🟢 SHOW PRODUCTS
let container = document.getElementById("productList");

products.forEach((item, index) => {

    container.innerHTML += `
        <div class="product-card">
            <img src="${item.image}">
            <h3>${item.name}</h3>
            <p class="price">₹${item.price}</p>

            <select id="size${index}">
                ${item.size.map(s => `<option>${s}</option>`).join("")}
            </select>

            <input type="number" id="qty${index}" value="1" min="1">

            <br>

            <button onclick="addToCart(
                '${item.name}',
                ${item.price},
                '${item.image}',
                document.getElementById('size${index}').value,
                document.getElementById('qty${index}').value
            )">
                Add to Cart
            </button>

            <button onclick="buyNow(
                '${item.name}',
                ${item.price},
                document.getElementById('size${index}').value,
                document.getElementById('qty${index}').value
            )">
                Buy Now
            </button>
        </div>
    `;
});

</script>

</body>
</html>
