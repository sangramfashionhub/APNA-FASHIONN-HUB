<!DOCTYPE html>
<html>
<head>
    <title>Men Clothing</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .product-card {
            width: 220px;
            margin: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 10px;
        }

        .product-card img {
            width: 100%;
            height: 200px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        select, input {
            margin: 5px;
            padding: 5px;
        }

        button {
            background: black;
            color: white;
            padding: 8px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: green;
        }
    </style>
</head>

<body>

<h1>Men Collection</h1>

<div class="container" id="productList"></div>

<script>

// 🛒 PRODUCTS
let products = [
    { 
        name: "White Shirt",
        price: 499,
        size: ["S","L","XL","XXL"],
        image: "men.white.shirt.jpeg"
    },
    { 
        name: "Black Jeans",
        price: 999,
        size: ["30","32","34","36","38"],
        image: "men.black.jean.jpeg"
    },
    { 
        name: "Red T-Shirt",
        price: 299,
        size: ["S","L","XL"],
        image: "men.tshirt.red.jpeg"
    }
];

// 🛒 ADD TO CART
function addToCart(name, price, image, size, qty) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({ name, price, image, size, qty });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Added to cart ✅");
}

// 💰 BUY NOW (UPI + WhatsApp)
function buyNow(name, price, size, qty) {

    let total = price * qty;

    // UPI Payment
    let upi = `upi://pay?pa=9923343791@ybl&pn=FashionHub&am=${total}&cu=INR`;
    window.location.href = upi;

    // WhatsApp message
    let msg = `Order Details:\nProduct: ${name}\nSize: ${size}\nQty: ${qty}\nTotal: ₹${total}`;
    let phone = "919923343791";

    let url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    
    setTimeout(() => {
        window.open(url, "_blank");
    }, 2000);
}

// 🛒 SHOW PRODUCTS
let container = document.getElementById("productList");

products.forEach((item, index) => {

    container.innerHTML += `
        <div class="product-card">
            <img src="${item.image}">
            <h3>${item.name}</h3>
            <p class="price">₹${item.price}</p>

            <select id="size${index}">
                ${item.size.map(s => `<option>${s}</option>`).join("")}
            </select>

            <input type="number" id="qty${index}" value="1" min="1">

            <br>

            <button onclick="addToCart(
                '${item.name}', 
                ${item.price}, 
                '${item.image}',
                document.getElementById('size${index}').value,
                document.getElementById('qty${index}').value
            )">
                Add to Cart
            </button>

            <button onclick="buyNow(
                '${item.name}', 
                ${item.price},
                document.getElementById('size${index}').value,
                document.getElementById('qty${index}').value
            )">
                Buy Now
            </button>
        </div>
    `;
});

</script>

</body>
</html>
