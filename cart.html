<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h2 {
            background: black;
            color: white;
            padding: 10px;
        }

        .box {
            margin: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: green;
        }
    </style>
</head>

<body>

<h2>🛒 Your Cart</h2>

<div class="box">
    <p>Total Amount: ₹<span id="total">100</span></p>

    <button onclick="payNow()">💳 Pay & Order</button>
</div>

<script>

// 🟢 Get total amount (future upgrade)
let amount = document.getElementById("total").innerText;

// 🟢 Payment Function
function payNow(){

    let user = JSON.parse(localStorage.getItem("user"));

    if(!user){
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    // 🟢 UPI Payment Link
    let upiLink = "upi://pay?pa=9923343791@upi&pn=APNA FASHION HUB&am=" + amount + "&cu=INR";

    // 🟢 Open UPI App
    window.location.href = upiLink;

    // ⏳ Wait then open WhatsApp
    setTimeout(function(){

        let orderId = Math.floor(Math.random() * 100000);

        let msg = "🛍️ *New Order* %0A"
                + "Order ID: " + orderId + "%0A"
                + "Name: " + user.name + "%0A"
                + "Mobile: " + user.mobile + "%0A"
                + "Address: " + user.address + "%0A"
                + "Pincode: " + user.pincode + "%0A"
                + "Amount: ₹" + amount;

        let whatsapp = "https://wa.me/919923343791?text=" + msg;

        window.open(whatsapp, "_blank");

    }, 5000); // 5 sec delay
}

</script>

</body>
</html>
