<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h2 {
            background: black;
            color: white;
            padding: 10px;
        }

        .box {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .item {
            margin: 10px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: green;
        }
    </style>
</head>

<body>

<h2>🛒 Your Cart</h2>

<div class="box">

    <div id="items"></div>

    <h3>Total: ₹<span id="total">0</span></h3>

    <button onclick="clearCart()">🗑️ Clear Cart</button>
    <br><br>
    <button onclick="payNow()">💳 Pay & Order</button>

</div>

<script>

// 🟢 Load Cart
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let itemsDiv = document.getElementById("items");
let total = 0;

// 🟢 Display Items
function loadCart(){

    itemsDiv.innerHTML = "";
    total = 0;

    cart.forEach((item, index) => {

        let itemTotal = item.price * item.qty;

        itemsDiv.innerHTML += `
            <div class="item">
                ${item.name} (${item.size}) - ₹${item.price} × ${item.qty} = ₹${itemTotal}
                <br>
                <button onclick="removeItem(${index})">❌ Remove</button>
            </div>
        `;

        total += itemTotal;
    });

    document.getElementById("total").innerText = total;
}

loadCart();

// ❌ Remove Item
function removeItem(index){

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    loadCart();
}

// 🗑️ Clear Cart
function clearCart(){
    localStorage.removeItem("cart");
    location.reload();
}

// 💳 Payment
function payNow(){

    let user = JSON.parse(localStorage.getItem("user"));

    if(!user){
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    if(total == 0){
        alert("Cart is empty");
        return;
    }

    let upiLink = "upi://pay?pa=9923343791@upi&pn=APNA FASHION HUB&am=" + total + "&cu=INR";

    // 🟢 First open UPI
    window.location.href = upiLink;

    // ⏳ Then WhatsApp after delay
    setTimeout(function(){

        let orderId = Math.floor(Math.random() * 100000);

        let msg = "🛍️ *New Order* %0A"
                + "Order ID: " + orderId + "%0A"
                + "Name: " + user.name + "%0A"
                + "Mobile: " + user.mobile + "%0A"
                + "Address: " + user.address + "%0A"
                + "Pincode: " + user.pincode + "%0A"
                + "Amount: ₹" + total;

        let whatsapp = "https://wa.me/919923343791?text=" + msg;

        window.open(whatsapp, "_blank");

    }, 5000);
}

</script>

</body>
</html>
