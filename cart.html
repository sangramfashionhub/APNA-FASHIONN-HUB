<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h2 {
            background: black;
            color: white;
            padding: 10px;
        }

        .box {
            margin: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .item {
            border-bottom: 1px solid #ccc;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: green;
        }
    </style>
</head>

<body>

<h2>🛒 Your Cart</h2>

<div class="box">

    <!-- 🟢 Items list -->
    <div id="items"></div>

    <!-- 🟢 Total -->
    <h3>Total Amount: ₹<span id="total">0</span></h3>

    <button onclick="payNow()">💳 Pay & Order</button>

</div>

<script>

// 🟢 Load Cart
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let itemsDiv = document.getElementById("items");
let total = 0;

// 🟢 Show items + calculate total
cart.forEach(item => {

    let itemTotal = item.price * item.qty; // ✅ quantity multiply

    itemsDiv.innerHTML += `
        <div class="item">
            ${item.name} (${item.size}) - ₹${item.price} × ${item.qty} = ₹${itemTotal}
        </div>
    `;

    total += itemTotal;
});

// 🟢 Show total
document.getElementById("total").innerText = total;


// 🟢 Payment Function
function payNow(){

    let user = JSON.parse(localStorage.getItem("user"));

    if(!user){
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    if(total == 0){
        alert("Cart is empty ❌");
        return;
    }

    // 🟢 UPI
    let upiLink = "upi://pay?pa=9923343791@ybl&pn=FashionHub&am=" + total + "&cu=INR";

    window.location.href = upiLink;

    // 🟢 WhatsApp
    setTimeout(function(){

        let orderId = Math.floor(Math.random() * 100000);

        let msg = "🛍️ *New Order* %0A"
                + "Order ID: " + orderId + "%0A"
                + "Name: " + user.name + "%0A"
                + "Mobile: " + user.mobile + "%0A"
                + "Amount: ₹" + total;

        let whatsapp = "https://wa.me/919923343791?text=" + msg;

        window.open(whatsapp, "_blank");

    }, 5000);
}

</script>

</body>
</html>
