<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .item {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }

        button {
            padding: 8px;
            margin: 5px;
            cursor: pointer;
            border: none;
            background: black;
            color: white;
        }

        button:hover {
            background: green;
        }
    </style>
</head>

<body>

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<br>

<button onclick="checkoutAll()">Checkout All</button>

<script>

// 🔐 LOGIN CHECK
let user = JSON.parse(localStorage.getItem("user"));
if(!user){
    window.location.href = "login.html";
}

// 🛒 LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let container = document.getElementById("cartItems");

if(cart.length === 0){
    container.innerHTML = "<h3>Cart is empty</h3>";
}else{
    cart.forEach((item, index) => {
        container.innerHTML += `
            <div class="item">
                <h3>${item.name}</h3>
                <p>Price: ₹${item.price}</p>
                <p>Size: ${item.size}</p>
                <p>Qty: ${item.qty}</p>

                <button onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });
}

// ❌ REMOVE ITEM
function removeItem(index){
    cart.splice(index,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    location.reload();
}

// 💰 CHECKOUT ALL
function checkoutAll(){

    if(cart.length === 0){
        alert("Cart is empty ❌");
        return;
    }

    let total = 0;
    let orderText = "";

    cart.forEach(item => {
        total += item.price * item.qty;

        orderText += `Product: ${item.name}
Size: ${item.size}
Qty: ${item.qty}
Price: ₹${item.price}

`;
    });

    // 📱 WhatsApp FIRST
    let msg = `🛒 Order Details:

${orderText}

Total: ₹${total}

👤 Customer Details:
Name: ${user.name}
Mobile: ${user.mobile}
Address: ${user.address}
Pincode: ${user.pincode}`;

    let phone = "919923343791";

    let waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(waUrl, "_blank");

    // 💸 UPI AFTER
    let upi = `upi://pay?pa=9923343791@ybl&pn=FashionHub&am=${total}&cu=INR`;

    setTimeout(()=>{
        window.location.href = upi;
    },1500);

    // 🧹 Clear cart after order
    localStorage.removeItem("cart");
}

</script>

</body>
</html>
