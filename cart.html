<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>

    <style>
        body { font-family: Arial; text-align: center; }

        h2 {
            background: black;
            color: white;
            padding: 10px;
        }

        .item {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }

        img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        button {
            padding: 8px 12px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: green;
        }

        .pay {
            background: green;
            padding: 12px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<h2>🛒 Your Cart</h2>

<div id="cartBox"></div>

<h3>Total: ₹<span id="total">0</span></h3>

<button class="pay" onclick="payNow()">💳 Pay Now</button>

<script>

// 🔥 LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let box = document.getElementById("cartBox");
let total = 0;

function renderCart(){

    box.innerHTML = "";
    total = 0;

    cart.forEach((item, index) => {

        let itemTotal = item.price * item.qty;
        total += itemTotal;

        box.innerHTML += `
            <div class="item">
                <img src="${item.image}">
                <h3>${item.name}</h3>
                <p>Size: ${item.size}</p>
                <p>Qty: ${item.qty}</p>
                <p>Price: ₹${itemTotal}</p>

                <button onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total;
}

// ❌ REMOVE ITEM
function removeItem(index){

    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

// 💳 PAYMENT + WHATSAPP
function payNow(){

    let user = JSON.parse(localStorage.getItem("user"));

    if(!user){
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    let orderId = Date.now();

    let msg = `🛍️ ORDER
ID: ${orderId}
Name: ${user.name}
Mobile: ${user.mobile}
Address: ${user.address}
Pincode: ${user.pincode}
Total: ₹${total}`;

    let whatsapp = "https://wa.me/919923343791?text=" + encodeURIComponent(msg);

    // clear cart
    localStorage.removeItem("cart");

    window.open(whatsapp, "_blank");
}

// start
renderCart();

</script>

</body>
</html>
