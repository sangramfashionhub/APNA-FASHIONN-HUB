<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h2 {
            background: black;
            color: white;
            padding: 10px;
        }

        .box {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .item {
            margin: 10px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: green;
        }
    </style>
</head>

<body>

<h2>🛒 Your Cart</h2>

<div class="box">

    <div id="items"></div>

    <h3>Total: ₹<span id="total">0</span></h3>

    <button onclick="clearCart()">🗑️ Clear Cart</button>
    <br><br>

    <button onclick="payNow()">💳 Pay & Order</button>

    <br><br>

    <button onclick="sendWhatsApp()">📲 Send Order on WhatsApp</button>

</div>

<script>

// 🔐 Login check
let user = JSON.parse(localStorage.getItem("user"));
if(!user){
    window.location.href = "login.html";
}

// 🛒 Load cart
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let itemsDiv = document.getElementById("items");
let total = 0;

// 📦 Show cart items
function loadCart(){

    itemsDiv.innerHTML = "";
    total = 0;

    cart.forEach((item, index) => {

        let itemTotal = item.price * item.qty;

        itemsDiv.innerHTML += `
            <div class="item">
                <b>${item.name}</b> (${item.size})<br>
                ₹${item.price} × ${item.qty} = ₹${itemTotal}
                <br>
                <button onclick="removeItem(${index})">❌ Remove</button>
            </div>
        `;

        total += itemTotal;
    });

    document.getElementById("total").innerText = total;
}

loadCart();

// ❌ Remove item
function removeItem(index){
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

// 🗑️ Clear cart
function clearCart(){
    localStorage.removeItem("cart");
    location.reload();
}

// 💳 Pay now (UPI first)
function payNow(){

    if(total == 0){
        alert("Cart is empty");
        return;
    }

    let orderId = Math.floor(Math.random() * 100000);

    let msg = "🛍️ *New Order* %0A"
            + "Order ID: " + orderId + "%0A"
            + "Name: " + user.name + "%0A"
            + "Mobile: " + user.mobile + "%0A"
            + "Address: " + user.address + "%0A"
            + "Pincode: " + user.pincode + "%0A"
            + "Amount: ₹" + total;

    let whatsapp = "https://wa.me/919923343791?text=" + msg;

    // save whatsapp link
    localStorage.setItem("whatsappLink", whatsapp);

    // UPI open
    let upiLink = "upi://pay?pa=9923343791@upi&pn=FashionHub&am=" + total + "&cu=INR";
    window.location.href = upiLink;

    alert("Payment केल्यानंतर WhatsApp button क्लिक करा 📲");
}

// 📲 WhatsApp send
function sendWhatsApp(){

    let link = localStorage.getItem("whatsappLink");

    if(!link){
        alert("First Pay & Order click करा");
        return;
    }

    window.open(link, "_blank");
}

</script>

</body>
</html>
