<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        h2 {
            background: black;
            color: white;
            padding: 10px;
        }

        .item {
            background: white;
            border: 1px solid #ccc;
            margin: 10px auto;
            padding: 10px;
            border-radius: 10px;
            width: 300px;
        }

        img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        button {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            margin: 5px;
            color: white;
            background: black;
        }

        button:hover {
            background: green;
        }

        .pay {
            background: green;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
        }

        .total-box {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h2>🛒 Your Cart</h2>

<div id="cartBox"></div>

<div class="total-box">
    <h3>Total: ₹<span id="total">0</span></h3>
</div>

<button class="pay" onclick="payNow()">💳 Pay & Order</button>

<script>

// 🔥 LOAD CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart(){

    let box = document.getElementById("cartBox");
    box.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {

        let itemTotal = item.price * item.qty;
        total += itemTotal;

        box.innerHTML += `
            <div class="item">
                <img src="${item.image}">
                <h3>${item.name}</h3>
                <p>Size: ${item.size}</p>
                <p>Qty: ${item.qty}</p>
                <p>Price: ₹${itemTotal}</p>

                <button onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    document.getElementById("total").innerText = total;
}

// ❌ REMOVE ITEM
function removeItem(index){

    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

// 💳 PAY NOW + WHATSAPP ORDER
function payNow(){

    let user = JSON.parse(localStorage.getItem("user"));

    if(!user){
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    let orderId = Date.now();

    let productList = "";
    let total = 0;

    cart.forEach(item => {

        let itemTotal = item.price * item.qty;
        total += itemTotal;

        productList += `
🛍️ Product: ${item.name}
📏 Size: ${item.size}
🔢 Qty: ${item.qty}
💰 Price: ₹${itemTotal}
--------------------\n`;
    });

    let msg = `🛍️ NEW ORDER
🆔 Order ID: ${orderId}

👤 Name: ${user.name}
📱 Mobile: ${user.mobile}
🏠 Address: ${user.address}
📍 Pincode: ${user.pincode}

🛒 ITEMS:
${productList}

💰 TOTAL: ₹${total}`;

    let whatsapp = "https://wa.me/919923343791?text=" + encodeURIComponent(msg);

    // clear cart after order
    localStorage.removeItem("cart");

    window.open(whatsapp, "_blank");
}

// START
renderCart();

</script>

</body>
</html>
