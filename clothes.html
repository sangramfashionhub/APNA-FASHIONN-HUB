<!DOCTYPE html>
<html>
<head>
    <title>Clothes</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            margin: 20px;
            width: 200px;
        }

        .card img {
            width: 100%;
            height: 150px;
        }
    </style>
</head>

<body>

<h1>Clothes Collection</h1>

<div class="container">

    <div class="card">
        <img src="cloth.men.jpeg">
        <h3>Men</h3>
    </div>

    <div class="card">
        <img src="cloth.women.jpeg">
        <h3>Women</h3>
    </div>

    <div class="card">
        <img src="cloth.boys.jpeg">
        <h3>Boys</h3>
    </div>

    <div class="card">
        <img src="cloth.girls.jpeg">
        <h3>Girls</h3>
    </div>

</div>

</body>
</html>
